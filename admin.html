<style>

========================================================== */

<!--
==============================================================
 SUPABASE CLIENT
==============================================================
 Use the current Supabase browser client.

 IMPORTANT:
 The key here must be the PUBLIC ANON/PUBLISHABLE KEY.
 NEVER put a service-role/secret key in browser JavaScript.
==============================================================
-->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

/* ============================================================
   CONFIGURATION
============================================================ */

const SUPABASE_URL =
    "YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
    "YOUR_SUPABASE_ANON_OR_PUBLISHABLE_KEY";

/*
   Existing admin destination.

   Change ONLY this path if your existing administrator dashboard
   uses another filename.
*/
const ADMIN_DESTINATION =
    "admin.html";


/* ============================================================
   DOM
============================================================ */

const page =
    document.getElementById("page");

const loginForm =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const rememberInput =
    document.getElementById("remember");

const loginButton =
    document.getElementById("loginButton");

const togglePassword =
    document.getElementById("togglePassword");

const message =
    document.getElementById("message");

const loaderOverlay =
    document.getElementById("loaderOverlay");


/* ============================================================
   SUPABASE CLIENT
============================================================ */

let supabaseClient = null;


function initializeSupabase(){

    if(
        !SUPABASE_URL ||
        SUPABASE_URL === "YOUR_SUPABASE_URL"
    ){
        return false;
    }

    if(
        !SUPABASE_ANON_KEY ||
        SUPABASE_ANON_KEY ===
        "YOUR_SUPABASE_ANON_OR_PUBLISHABLE_KEY"
    ){
        return false;
    }

    if(
        typeof window.supabase === "undefined"
    ){
        return false;
    }

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY,
            {
                auth:{
                    persistSession:true,
                    autoRefreshToken:true,
                    detectSessionInUrl:true
                }
            }
        );

    return true;
}


/* ============================================================
   UI HELPERS
============================================================ */

function showMessage(
    text,
    type = "error"
){

    message.textContent =
        text;

    message.className =
        "message show " + type;
}


function clearMessage(){

    message.textContent = "";

    message.className =
        "message";
}


function setButtonLoading(
    loading
){

    loginButton.disabled =
        loading;

    loginButton.classList.toggle(
        "loading",
        loading
    );
}


function showLoader(){

    loaderOverlay.classList.add(
        "active"
    );

    loaderOverlay.setAttribute(
        "aria-hidden",
        "false"
    );
}


function hideLoader(){

    loaderOverlay.classList.remove(
        "active"
    );

    loaderOverlay.setAttribute(
        "aria-hidden",
        "true"
    );
}


/* ============================================================
   VIBRATION
============================================================ */

function vibrateWrongAttempt(){

    try{

        if(
            "vibrate" in navigator
        ){

            navigator.vibrate([
                90,
                55,
                90,
                55,
                150
            ]);

        }

    }catch(error){

        console.debug(
            "Vibration unavailable.",
            error
        );

    }
}


/* ============================================================
   WRONG LOGIN SOUND
============================================================ */

function playErrorSound(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext)
            return;

        const context =
            new AudioContext();

        const oscillator =
            context.createOscillator();

        const gain =
            context.createGain();

        oscillator.type =
            "sine";

        oscillator.frequency.setValueAtTime(
            440,
            context.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            180,
            context.currentTime + .18
        );

        gain.gain.setValueAtTime(
            .0001,
            context.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .18,
            context.currentTime + .015
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            context.currentTime + .22
        );

        oscillator.connect(gain);

        gain.connect(
            context.destination
        );

        oscillator.start();

        oscillator.stop(
            context.currentTime + .23
        );

        setTimeout(
            () => {
                context.close()
                    .catch(() => {});
            },
            350
        );

    }catch(error){

        console.debug(
            "Audio unavailable.",
            error
        );

    }
}


/* ============================================================
   WRONG LOGIN EFFECT
============================================================ */

function wrongAttempt(){

    page.classList.remove(
        "shake"
    );

    /*
       Force browser to restart the animation.
    */
    void page.offsetWidth;

    page.classList.add(
        "shake"
    );

    vibrateWrongAttempt();

    playErrorSound();
}


/* ============================================================
   PASSWORD VISIBILITY
============================================================ */

togglePassword.addEventListener(
    "click",
    () => {

        const visible =
            passwordInput.type ===
            "text";

        passwordInput.type =
            visible
                ? "password"
                : "text";

        togglePassword.textContent =
            visible
                ? "Show"
                : "Hide";

        togglePassword.setAttribute(
            "aria-label",
            visible
                ? "Show password"
                : "Hide password"
        );

    }
);


/* ============================================================
   LOCAL VALIDATION
============================================================ */

function validateCredentials(){

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    if(!email){

        showMessage(
            "Please enter your administrator email."
        );

        emailInput.focus();

        return false;
    }


    if(
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
            .test(email)
    ){

        showMessage(
            "Please enter a valid email address."
        );

        emailInput.focus();

        return false;
    }


    if(!password){

        showMessage(
            "Please enter your password."
        );

        passwordInput.focus();

        return false;
    }


    return true;
}


/* ============================================================
   LOGIN
============================================================ */

loginForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        clearMessage();


        if(
            !validateCredentials()
        ){
            return;
        }


        if(
            !initializeSupabase()
        ){

            showMessage(
                "Supabase is not configured. " +
                "Insert your Supabase project URL and " +
                "public anon/publishable key in this file."
            );

            return;
        }


        const email =
            emailInput.value
                .trim()
                .toLowerCase();

        const password =
            passwordInput.value;


        setButtonLoading(true);


        try{

            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .signInWithPassword({
                        email,
                        password
                    });


            if(error){

                wrongAttempt();

                throw error;
            }


            if(
                !data ||
                !data.session
            ){

                wrongAttempt();

                throw new Error(
                    "Authentication session was not created."
                );
            }


            showMessage(
                "Authentication successful. Opening administrator platform...",
                "success"
            );


            showLoader();


            /*
               Give the successful state enough time for the
               visual transition before navigation.
            */

            setTimeout(
                () => {

                    window.location.assign(
                        ADMIN_DESTINATION
                    );

                },
                650
            );


        }catch(error){

            console.error(
                "ADMIN LOGIN:",
                error
            );


            hideLoader();


            let text =
                "Unable to sign in. Please check your email and password.";


            if(
                error &&
                typeof error.message ===
                "string"
            ){

                const raw =
                    error.message.toLowerCase();


                if(
                    raw.includes(
                        "invalid login credentials"
                    )
                ){

                    text =
                        "Incorrect administrator email or password.";

                }else if(
                    raw.includes(
                        "email not confirmed"
                    )
                ){

                    text =
                        "This administrator account has not been confirmed.";

                }else if(
                    raw.includes(
                        "too many requests"
                    )
                ){

                    text =
                        "Too many login attempts. Please wait and try again.";

                }else if(
                    raw.includes(
                        "network"
                    )
                ){

                    text =
                        "Network connection problem. Please try again.";

                }

            }


            showMessage(
                text
            );

        }finally{

            setButtonLoading(false);

        }

    }
);


/* ============================================================
   INPUT CLEANUP
============================================================ */

emailInput.addEventListener(
    "input",
    clearMessage
);

passwordInput.addEventListener(
    "input",
    clearMessage
);


/* ============================================================
   EXISTING SESSION CHECK
============================================================ */

async function checkExistingSession(){

    if(
        !initializeSupabase()
    ){
        return;
    }

    try{

        const {
            data
        } =
            await supabaseClient
                .auth
                .getSession();


        if(
            data &&
            data.session
        ){

            /*
               Existing authenticated administrator.
               We don't force navigation immediately because
               the user may have opened the login page intentionally.
            */

            showMessage(
                "An administrator session is already active.",
                "success"
            );

        }

    }catch(error){

        console.debug(
            "Session check failed:",
            error
        );

    }

}


/* ============================================================
   REMEMBER DEVICE
============================================================ */

try{

    const remembered =
        localStorage.getItem(
            "misbahul_admin_remember"
        );

    if(
        remembered === "true"
    ){

        rememberInput.checked =
            true;

    }

}catch(error){

    console.debug(
        "Local storage unavailable.",
        error
    );

}


rememberInput.addEventListener(
    "change",
    () => {

        try{

            localStorage.setItem(
                "misbahul_admin_remember",
                String(
                    rememberInput.checked
                )
            );

        }catch(error){

            console.debug(
                "Unable to save preference.",
                error
            );

        }

    }
);


/* ============================================================
   START
============================================================ */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        checkExistingSession();

    }
);

</script>
